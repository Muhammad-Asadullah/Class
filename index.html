        <script>
    // Ex 2: sum of all multiples of a or b below n
    function sumOfMultiples(a, b, n) {
      let sum = 0;
      for (let i = 1; i < n; i++) {
        if (i % a === 0 || i % b === 0) {
          sum += i;
        }
      }
      return sum;
    }
 
    // Ex 2.1: read a, b and n from the text boxes
    function calculate() {
      const a = parseInt(document.getElementById("a").value);
      const b = parseInt(document.getElementById("b").value);
      const n = parseInt(document.getElementById("n").value);
 
      if (isNaN(a) || isNaN(b) || isNaN(n) || a <= 0 || b <= 0) {
        alert("Please enter valid numbers (a and b must be greater than 0).");
        return;
      }
 
      const result = sumOfMultiples(a, b, n);
      alert("Sum of multiples of " + a + " or " + b + " below " + n + " = " + result);
    }
  </script>
